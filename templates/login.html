{% extends "base.html" %}

{% block title %}Login - Library Management System{% endblock %}

{% block body_class %}login-page{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
            <div class="card shadow-lg">
                <div class="card-body">
                    <!-- Icon + Title -->
                    <div class="text-center mb-4">
                        <i class="fas fa-user-circle fa-3x text-primary"></i>
                        <h3 class="mt-2">Login</h3>
                        <p class="text-muted">Access your library account</p>
                    </div>

                    <!-- Login Form -->
                    <form method="POST" action="{{ url_for('login') }}">
                        <div class="mb-3">
                            <label for="username" class="form-label">Username/MemberID</label>
                            <input 
                                type="text" 
                                class="form-control" 
                                id="username" 
                                name="username" 
                                placeholder="Enter your username" 
                                required>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input 
                                type="password" 
                                class="form-control" 
                                id="password" 
                                name="password" 
                                placeholder="Enter your password" 
                                required>
                        </div>

                        <!-- Forgot Password Link -->
                        <div class="mb-3 text-end">
                            <a href="{{ url_for('forgot_password') }}" class="text-decoration-none text-primary small">
                                <i class="fas fa-key"></i> Forgot Password?
                            </a>
                        </div>

                        <!-- 
                        The Role dropdown is now removed (or commented out) 
                        as you wanted. The Flask code handles this now.
                        
                        <div class="mb-3">
                            <label for="role" class="form-label">Role</label>
                            <select class="form-control" id="role" name="role" required>
                                <option value="">-- Select Role --</option>
                                <option value="Admin">Admin</option>
                                <option value="Owner">Owner</option>
                                <option value="User">User</option>
                            </select>
                        </div> 
                        -->

                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary btn-lg">
                                <i class="fas fa-sign-in-alt"></i> Login
                            </button>
                        </div>
                    </form>

                
                </div>
            </div>
        </div>
    </div>
</div>

<!-- External JS for validation -->
<script src="{{ url_for('static', filename='js/login-validation.js') }}"></script>
{% endblock %}
